<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantUML Server</title>
    <script src="https://unpkg.com/monaco-editor@0.29.1/min/vs/loader.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.29.1/min/vs' }});
        window.MonacoEnvironment = { getWorkerUrl: () => proxy };
        let proxy = URL.createObjectURL(new Blob([`
            self.MonacoEnvironment = {
                baseUrl: 'https://unpkg.com/monaco-editor@0.29.1/min/'
            };
            importScripts('https://unpkg.com/monaco-editor@0.29.1/min/vs/base/worker/workerMain.js');
        `], { type: 'application/javascript' }));
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-6 bg-white shadow-md rounded-lg mt-10">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">PlantUML Server</h1>
        <div class="flex space-x-4 mb-6">
            <div id="editor" class="flex-1 h-80 border border-gray-300 rounded"></div>
            <div id="diagramOutput" class="flex-1 bg-gray-50 border border-gray-300 p-4 rounded"></div>
        </div>
        <div class="flex space-x-4 mb-6">
            <button id="downloadPng" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Download as PNG</button>
            <button id="downloadSvg" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Download as SVG</button>
            <button id="downloadTxt" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">Download as TXT</button>
        </div>
        <div id="cheatSheet" class="bg-gray-50 p-4 rounded mb-6">
            <h3 class="text-xl font-semibold text-gray-700">チートシート</h3>
            <p class="text-gray-600">例: </p>
            <pre class="bg-gray-100 p-3 rounded mt-2 text-sm">
@startuml
actor User
User -> (Usecase Example)
@enduml
            </pre>
        </div>
        <div id="practicePrompt" class="bg-gray-50 p-4 rounded mb-6">
            <h3 class="text-xl font-semibold text-gray-700">練習問題</h3>
            <button id="generatePrompt" class="px-4 py-2 mt-2 bg-purple-500 text-white rounded hover:bg-purple-600">練習問題を表示する</button>
            <p id="promptOutput" class="text-gray-600 mt-2"></p>
        </div>
        
        <div id="correctAnswer" class="bg-gray-50 p-4 rounded">
            <h3 class="text-xl font-semibold text-gray-700">正解</h3>
            <p id="answerUmlCode" class="bg-gray-100 p-3 rounded mt-2 text-sm"></p>
            <div id="answerDiagramOutput" class="mt-4"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
